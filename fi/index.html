      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <!--seo-langswitch-->
      <!-- Interactive terminal. Built by main.ts; absent entirely without JS. -->
      <div id="app"></div>
      <!-- The real page, rendered from src/content/fi.ts at build time. -->
      <!--seo-content-->
    </div>
    <script type="module" src="/src/main.ts"></script>
